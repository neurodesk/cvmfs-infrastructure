# Public, aggregated CVMFS usage statistics generated by cvmfs-access-stats
<Directory "/var/www/html/stats">
    Options -Indexes -MultiViews
    AllowOverride None
    Require all granted
    <FilesMatch "^\.">
        Require all denied
    </FilesMatch>
    Header set Cache-Control "public, max-age=3600"
</Directory>
