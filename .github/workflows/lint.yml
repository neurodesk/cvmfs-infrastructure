name: lint

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Install tools
        run: pip install "ansible-core==2.16.14" "ansible-lint==24.12.2"

      - name: Refuse unencrypted vault files
        run: |
          fail=0
          for f in $(git ls-files '*vault.yml'); do
            if ! head -n1 "$f" | grep -q '^\$ANSIBLE_VAULT'; then
              echo "::error file=$f::vault file is not encrypted"; fail=1
            fi
          done
          exit $fail

      - name: Refuse plaintext passwords outside the vault
        run: |
          # literal password values (not Jinja-templated) in tracked files
          if git ls-files -z -- ':!*vault.yml' ':!*.example' \
              | xargs -0 grep -nIiE "password[\"']?[[:space:]]*[:=]?[[:space:]]*[\"'][^\"'{]+[\"']"; then
            echo "::error::plaintext password found; put it in the encrypted vault.yml"
            exit 1
          fi

      - name: Python syntax (stats script must stay Python 3.9 compatible)
        run: python -m py_compile roles/access_stats/files/cvmfs-access-stats

      - name: Aggregator syntax
        run: python -m py_compile aggregate/aggregate.py

      - name: Playbook syntax
        run: ansible-playbook --syntax-check site.yml

      - name: ansible-lint
        run: ansible-lint site.yml
