[defaults]
inventory = inventory/hosts.yml
roles_path = roles
interpreter_python = auto_silent
# community.general's 'yaml' callback was removed (community.general 12.0.0);
# the built-in default callback prints task results as YAML since ansible-core 2.13.
stdout_callback = default
callback_result_format = yaml
retry_files_enabled = false

[privilege_escalation]
become = true
